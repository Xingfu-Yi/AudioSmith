name: Bug report
description: Report a reproducible Audio Smith problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Audio Smith. Never attach private recordings or transcripts.
  - type: input
    id: version
    attributes:
      label: Audio Smith version
      placeholder: 0.1.2 (3) or commit SHA
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac hardware
      description: Include chip and physical memory.
      placeholder: M1 Pro, 32GB
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shortcut or permissions
        - Audio capture
        - Streaming transcription
        - Final paste
        - Model download or verification
        - Skills
        - Memory or performance
        - Build or release
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest reliable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostics
      description: Include footprint and timing if relevant. Remove transcript text, audio, credentials and personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed private audio, transcripts and credentials.
          required: true
