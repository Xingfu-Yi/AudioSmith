name: Feature request
description: Propose a focused improvement to local dictation or Skills.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result.
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Can this remain fully local?
      options:
        - Yes
        - Unsure
        - No
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: I understand that the 5GB footprint ceiling and no-transcript-storage policy are release requirements.
          required: true
