name: AudioSmith
configs:
  Debug: debug
  Test: debug
  Release: release
options:
  bundleIdPrefix: com.xingfuyi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift.git
    revision: 4266f988d170a83017d1e82e2e4654602f277f1d
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: false
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    DEAD_CODE_STRIPPING: true
targets:
  AudioSmith:
    type: application
    platform: macOS
    productName: "Audio Smith"
    sources:
      - path: AudioSmith
        excludes:
          - Resources/Info.plist
          - Resources/AudioSmith.entitlements
          - Resources/Skills
      - path: AudioSmith/Resources/Skills
        type: folder
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: MLXAudio
        product: MLXAudioCore
      - package: MLXAudio
        product: MLXAudioSTT
    info:
      path: AudioSmith/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: Audio Smith 需要使用麦克风进行完全本地的语音转文字；音频不会保存或上传。
        NSHumanReadableCopyright: Copyright © 2026 Audio Smith contributors. MIT License.
        NSPrincipalClass: NSApplication
    entitlements:
      path: AudioSmith/Resources/AudioSmith.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingfuyi.AudioSmith
        PRODUCT_NAME: "Audio Smith"
        EXECUTABLE_NAME: AudioSmith
        PRODUCT_MODULE_NAME: AudioSmith
        APP_DISPLAY_NAME: Audio Smith
        MARKETING_VERSION: 0.1.7
        CURRENT_PROJECT_VERSION: 8
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: false
      configs:
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: com.xingfuyi.AudioSmith.TestHost
          APP_DISPLAY_NAME: Audio Smith Test Host
  AudioSmithTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AudioSmithTests
      - path: Examples/Skills
        type: folder
        buildPhase: resources
    dependencies:
      - target: AudioSmith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingfuyi.AudioSmithTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Audio Smith.app/Contents/MacOS/AudioSmith"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  AudioSmith:
    build:
      targets:
        AudioSmith: all
        AudioSmithTests: [test]
    test:
      config: Test
      targets:
        - AudioSmithTests
